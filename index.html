nt-size:16px;border:1px solid var(--line);background:#fffaf3;color:#665c53;border-radius:7px;padding:11px 12px;white-space:nowrap;flex:1;min-width:70px}.day-btn[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:white}.section-head{text-align:center;margin:14px 0 20px}.section-head h1,.section-head h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--wine);font-size:37px;line-height:1;letter-spacing:-.02em;margin:0 0 6px}.section-head p{margin:0;color:var(--ink-muted);font-size:11px;letter-spacing:.05em}.menu-card{border:1px solid var(--line);background:var(--paper);border-radius:7px;margin:0 0 14px;overflow:hidden;box-shadow:0 3px 8px #61442b08}.menu-card-head{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:17px 17px 13px;border-bottom:1px solid #e7dcd0}.menu-card-head h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--wine);font-size:26px;line-height:1;margin:0}.menu-card-head .left{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.price{font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;line-height:1;color:var(--wine);font-weight:500;white-space:nowrap}.price small{font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.02em;font-weight:700}.pill{border:1px solid #c9c1a2;color:#64704c;border-radius:30px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;font-weight:700}.dish{border-bottom:1px solid #eee5da}.dish:last-child{border-bottom:0}.dish-button{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;width:100%;padding:15px 17px;border:0;background:transparent;text-align:left;color:inherit}.dish-button:hover,.product-btn:hover{background:#f9f2e8}.dish-copy{min-width:0;flex:1}.dish-title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:24px;line-height:1.05;display:block}.dish-sub{font-family:Arial,Helvetica,sans-serif;margin-top:6px;color:var(--ink-muted);fo     @media(min-width:650px){.screen{margin:23px auto;border-radius:12px;overflow:clip;min-height:calc(100vh - 46px)}.nav-btn{font-size:11px}.day-btn{font-size:13px}.hero img{max-height:240px}}@media(max-width:360px){main{padding-left:13px;padding-right:13px}.nav-btn{font-size:9px}.day-btn{min-width:66px;padding:10px 8px}.dish-title{font-size:21px}}

    /* Header v9: wood background with real, accessible lowercase typography. */
    .hero{position:relative;min-height:clamp(180px,33.33vw,217px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#321e15 url('assets/header.webp?v=12.0') center center / cover no-repeat;text-align:center;padding:18px 10px 22px}
